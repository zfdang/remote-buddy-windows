name: Windows build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.RELEASE_TAG }}
      package_version: ${{ steps.version.outputs.RELEASE_PACKAGE_VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute deterministic release version
        id: version
        shell: bash
        run: |
          scripts/release-metadata.sh | tee "$RUNNER_TEMP/release-version"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/release-version" >> "$GITHUB_OUTPUT"

      - name: Restore solution
        run: dotnet restore RemoteBuddy.sln

      - name: Build solution
        run: dotnet build RemoteBuddy.sln -c Release -p:Version="${{ env.RELEASE_PACKAGE_VERSION }}"

      - name: Run unit tests
        run: dotnet test RemoteBuddy.sln -c Release --no-build --verbosity normal

      - name: Publish self-contained executable
        run: |
          dotnet publish src/RemoteBuddy.App/RemoteBuddy.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=none `
            -p:Version="${{ env.RELEASE_PACKAGE_VERSION }}" `
            -o dist/publish/win-x64

      - name: Archive publication artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/release
          Copy-Item LICENSE dist/publish/win-x64/
          Copy-Item THIRD_PARTY_NOTICES.md dist/publish/win-x64/
          foreach ($req in @("dist/publish/win-x64/RemoteBuddy.App.exe", "dist/publish/win-x64/LICENSE", "dist/publish/win-x64/THIRD_PARTY_NOTICES.md")) {
            if (-not (Test-Path $req)) {
              throw "Missing required release file: $req"
            }
          }
          $zipName = "Remote_Buddy_Windows_${{ env.RELEASE_TAG }}_x64.zip"
          $zipPath = "dist/release/$zipName"
          Compress-Archive -Path dist/publish/win-x64/* -DestinationPath $zipPath
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zipName" | Set-Content -Path dist/release/SHA256SUMS.txt -Encoding ascii

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-release-x64
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-release-x64
          path: release

      - name: Publish or update GitHub Release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists. Uploading assets..."
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            echo "Creating new release $RELEASE_TAG..."
            gh release create "$RELEASE_TAG" release/* \
              --target "${{ github.sha }}" \
              --title "Remote Buddy (Windows) $RELEASE_TAG" \
              --notes "Remote Buddy for Windows automated release $RELEASE_TAG."
          fi
